name: A site won't show in a preview
description: A page stays blank, says "refused to connect", or behaves differently than in a tab.
labels: [site-compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Many sites refuse to be shown inside other pages. Before reporting, please try **Allow on this site** (the shield in the toolbar) and **Reload**; for sites that need your sign-in, try **Open in a real window** (Tools). Only report public sites — never addresses of private pages.
  - type: input
    id: site
    attributes:
      label: Site (public address)
      placeholder: https://example.com/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you see?
      description: Blank preview, an error page, a sign-in loop, missing styles… A screenshot helps.
    validations:
      required: true
  - type: checkboxes
    id: tried
    attributes:
      label: What did you try?
      options:
        - label: The site is allowed in Breakpointer (shield icon)
        - label: Reloading the previews
        - label: Opening it in a real window (Tools → Open in real windows)
  - type: input
    id: version
    attributes:
      label: Breakpointer and browser version
      placeholder: Breakpointer 0.5.0, Chrome 156 on Windows 11
