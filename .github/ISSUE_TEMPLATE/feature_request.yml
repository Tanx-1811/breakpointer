name: Feature request or feedback
description: Ideas, missing features, or how you use Breakpointer
labels: [feedback]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: role
    attributes:
      label: You are mostly a… (optional)
      options:
        - Frontend developer
        - Designer
        - QA / tester
        - Agency / freelancer
        - Other
