<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages serves this page for any missing address, at any depth: resolve links from the site root. -->
    <base href="{{basePath}}" />
    <title>Page not found · Breakpointer</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/mark-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="assets/mark-512.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="main" class="notfound canvas">
      <div class="notfound-card">
        <img src="assets/mark.svg" width="56" height="56" alt="Breakpointer" />
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>There’s nothing at this address — at any width.</p>
        <div class="cta-row">
          <a class="button button-primary" href="./">Go to the home page</a>
        </div>
        <div class="notfound-vi" lang="vi">
          <h2>Không tìm thấy trang</h2>
          <p>Không có gì ở địa chỉ này — ở bất kỳ chiều rộng nào.</p>
          <p><a href="vi/">Về trang chủ tiếng Việt</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
